name: Announce

on:
  workflow_dispatch:
    inputs:
      tag:
        description: published release to announce, e.g. v13.0.3-tele.1
        required: true

permissions:
  contents: read

jobs:
  announce:
    name: Announce
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tele
          persist-credentials: false

      - name: Announce
        env:
          BOT_TOKEN: ${{ secrets.TELE_BOT_TOKEN }}
          CHANNEL: ${{ secrets.TELE_CHANNEL }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "::error::no TELE_BOT_TOKEN / TELE_CHANNEL secrets"
            exit 1
          fi
          gh release download "$TAG" --pattern tele-changelog.json
          python3 tele/ci/announce.py tele-changelog.json --repo "$GH_REPO"
